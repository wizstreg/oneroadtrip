function ortAddBaseMap(m){
  var glLayer;
  try{
    if(typeof L.maplibreGL==='function'){
      glLayer=L.maplibreGL({style:'https://tiles.openfreemap.org/styles/liberty',attribution:'\u00a9 OSM \u00a9 OpenFreeMap'});
      var onRemove=glLayer.onRemove;
      glLayer.onRemove=function(map){
        if(this.getMaplibreMap())return onRemove.call(this,map);
        var container=this.getContainer();
        if(container&&container.parentNode)container.parentNode.removeChild(container);
      };
      glLayer.addTo(m);
      return;
    }
  }catch(error){
    // removeLayer declenche aussi le retrait des ecouteurs zoom/move/resize.
    if(glLayer&&m.hasLayer(glLayer))m.removeLayer(glLayer);
    console.warn('[MAP] WebGL indisponible : fond OpenStreetMap utilise.',error);
  }
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom:19
  }).addTo(m);
}
function ortScrollToStep(el){
  if(!el)return;
  var tp=document.getElementById('textPanel');
  var nav=tp&&tp.querySelector('.ort-stepnav');
  var behavior=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
  // Page qui defile d'un bloc (t30-flow) : on fait defiler la page, pas le texte seul.
  if(window.innerWidth>900&&tp&&tp.contains(el)&&!document.body.classList.contains('t30-flow')){
    var offset=nav&&getComputedStyle(nav).display!=='none'?(parseFloat(getComputedStyle(tp).paddingTop)||0)+nav.offsetHeight+12:12;
    var top=tp.scrollTop+el.getBoundingClientRect().top-tp.getBoundingClientRect().top-tp.clientTop-offset;
    tp.scrollTo({top:Math.max(0,top),behavior:behavior});
  }else if(nav&&document.body.classList.contains('t20')){
    var off=nav.getBoundingClientRect().bottom;
    var y=el.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop)-off-10;
    window.scrollTo({top:Math.max(0,y),behavior:behavior});
  }else{
    el.scrollIntoView({behavior:behavior,block:'start'});
  }
}

andeltempo, pauzes niet meegerekend. Hoogteverschil en terrein kunnen die flink verlengen.',de:'Die Gehzeit wird auf der tats\u00e4chlichen Route bei durchschnittlichem Wandertempo berechnet, ohne Pausen. H\u00f6henunterschied und Gel\u00e4nde k\u00f6nnen sie deutlich verl\u00e4ngern.'},train:{fr:'La dur\u00e9e indiqu\u00e9e est celle d\u0027un train direct sur cette liaison, \u00e0 laquelle nous ajoutons 1 h pour rejoindre la gare et embarquer. Les horaires varient selon le jour et la saison, v\u00e9rifiez-les avant de r\u00e9server.',en:'The time shown is that of a direct train on this route, plus 1 hour to reach the station and board. Timetables vary by day and season, check them before booking.',es:'La duraci\u00f3n indicada es la de un tren directo en esta conexi\u00f3n, m\u00e1s 1 h para llegar a la estaci\u00f3n y embarcar. Los horarios var\u00edan seg\u00fan el d\u00eda y la temporada, compru\u00e9belos antes de reservar.',pt:'A dura\u00e7\u00e3o indicada \u00e9 a de um comboio direto nesta liga\u00e7\u00e3o, mais 1 h para chegar \u00e0 esta\u00e7\u00e3o e embarcar. Os hor\u00e1rios variam consoante o dia e a \u00e9poca, verifique-os antes de reservar.',it:'La durata indicata \u00e8 quella di un treno diretto su questo collegamento, pi\u00f9 1 h per raggiungere la stazione e salire a bordo. Gli orari variano secondo il giorno e la stagione, verificateli prima di prenotare.',ar:'\u0627\u0644\u0645\u062f\u0629 \u0627\u0644\u0645\u0630\u0643\u0648\u0631\u0629 \u0647\u064a \u0645\u062f\u0629 \u0642\u0637\u0627\u0631 \u0645\u0628\u0627\u0634\u0631 \u0639\u0644\u0649 \u0647\u0630\u0627 \u0627\u0644\u062e\u0637\u060c \u0645\u0636\u0627\u0641\u064b\u0627 \u0625\u0644\u064a\u0647\u0627 \u0633\u0627\u0639\u0629 \u0648\u0627\u062d\u062f\u0629 \u0644\u0644\u0648\u0635\u0648\u0644 \u0625\u0644\u0649 \u0627\u0644\u0645\u062d\u0637\u0629 \u0648\u0627\u0644\u0635\u0639\u0648\u062f. \u062a\u062a\u063a\u064a\u0631 \u0627\u0644\u0645\u0648\u0627\u0639\u064a\u062f \u062d\u0633\u0628 \u0627\u0644\u064a\u0648\u0645 \u0648\u0627\u0644\u0645\u0648\u0633\u0645\u060c \u062a\u062d\u0642\u0642 \u0645\u0646\u0647\u0627 \u0642\u0628\u0644 \u0627\u0644\u062d\u062c\u0632.',nl:'De vermelde duur is die van een directe trein op deze verbinding, plus 1 uur om het station te bereiken en in te stappen. Dienstregelingen verschillen per dag en seizoen, controleer ze voor u boekt.',de:'Angegeben ist die Fahrzeit eines direkten Zuges auf dieser Verbindung, zuz\u00fcglich 1 Stunde f\u00fcr Anfahrt zum Bahnhof und Einstieg. Die Fahrpl\u00e4ne \u00e4ndern sich je nach Tag und Saison, pr\u00fcfen Sie sie vor der Buchung.'},flight:{fr:'Ce temps de vol est estim\u00e9 d\u0027apr\u00e8s la distance, pour un vol direct. Nous y ajoutons 3 h pour la pr\u00e9sentation \u00e0 l\u0027a\u00e9roport, l\u0027embarquement et la sortie. Les escales, si vous en prenez, ne sont pas compt\u00e9es.',en:'This flight time is estimated from the distance, for a direct flight. We add 3 hours for airport check-in, boarding and exit. Stopovers, if you take any, are not counted.',es:'Este tiempo de vuelo se estima seg\u00fan la distancia, para un vuelo directo. A\u00f1adimos 3 h para la presentaci\u00f3n en el aeropuerto, el embarque y la salida. Las escalas, si las hace, no est\u00e1n contadas.',pt:'Este tempo de voo \u00e9 estimado a partir da dist\u00e2ncia, para um voo direto. Acrescentamos 3 h para a apresenta\u00e7\u00e3o no aeroporto, o embarque e a sa\u00edda. As escalas, se as fizer, n\u00e3o est\u00e3o contabilizadas.',it:'Questo tempo di volo \u00e8 stimato in base alla distanza, per un volo diretto. Aggiungiamo 3 h per la presentazione in aeroporto, l\u0027imbarco e l\u0027uscita. Gli scali, se ne fate, non sono conteggiati.',ar:'\u0632\u0645\u0646 \u0627\u0644\u0637\u064a\u0631\u0627\u0646 \u0647\u0630\u0627 \u0645\u0642\u062f\u064e\u0651\u0631 \u0627\u0646\u0637\u0644\u0627\u0642\u064b\u0627 \u0645\u0646 \u0627\u0644\u0645\u0633\u0627\u0641\u0629\u060c \u0644\u0631\u062d\u0644\u0629 \u0645\u0628\u0627\u0634\u0631\u0629. \u0648\u0646\u0636\u064a\u0641 \u0625\u0644\u064a\u0647 3 \u0633\u0627\u0639\u0627\u062a \u0644\u0625\u062c\u0631\u0627\u0621\u0627\u062a \u0627\u0644\u0645\u0637\u0627\u0631 \u0648\u0627\u0644\u0635\u0639\u0648\u062f \u0648\u0627\u0644\u062e\u0631\u0648\u062c. \u0623\u0645\u0627 \u0627\u0644\u062a\u0648\u0642\u0641\u0627\u062a\u060c \u0625\u0646 \u0648\u064f\u062c\u062f\u062a\u060c \u0641\u063a\u064a\u0631 \u0645\u062d\u062a\u0633\u0628\u0629.',nl:'Deze vliegtijd is geschat op basis van de afstand, voor een directe vlucht. We tellen er 3 uur bij op voor inchecken, boarden en uitgang. Tussenstops, als u die maakt, zijn niet meegerekend.',de:'Diese Flugzeit ist aus der Entfernung gesch\u00e4tzt, f\u00fcr einen Direktflug. Wir rechnen 3 Stunden f\u00fcr Check-in, Boarding und Ausgang hinzu. Zwischenlandungen, falls Sie welche nehmen, sind nicht enthalten.'},ferry:{fr:'La dur\u00e9e est celle de la travers\u00e9e, \u00e0 laquelle nous ajoutons 2 h pour l\u0027embarquement et le d\u00e9barquement (30 min pour les courtes travers\u00e9es). Les ferries d\u00e9pendent des saisons et de la m\u00e9t\u00e9o, r\u00e9servez \u00e0 l\u0027avance en haute saison.',en:'The time shown is the crossing itself, plus 2 hours for boarding and disembarking (30 minutes on short crossings). Ferries depend on the season and the weather, book ahead in high season.',es:'La duraci\u00f3n es la de la traves\u00eda, m\u00e1s 2 h para el embarque y el desembarque (30 min en traves\u00edas cortas). Los ferris dependen de la temporada y del tiempo, reserve con antelaci\u00f3n en temporada alta.',pt:'A dura\u00e7\u00e3o \u00e9 a da travessia, mais 2 h para o embarque e o desembarque (30 min nas travessias curtas). Os ferries dependem da \u00e9poca e do tempo, reserve com anteced\u00eancia na \u00e9poca alta.',it:'La durata \u00e8 quella della traversata, pi\u00f9 2 h per l\u0027imbarco e lo sbarco (30 min sulle traversate brevi). I traghetti dipendono dalla stagione e dal meteo, prenotate in anticipo in alta stagione.',ar:'\u0627\u0644\u0645\u062f\u0629 \u0647\u064a \u0645\u062f\u0629 \u0627\u0644\u0639\u0628\u0648\u0631\u060c \u0645\u0636\u0627\u0641\u064b\u0627 \u0625\u0644\u064a\u0647\u0627 \u0633\u0627\u0639\u062a\u0627\u0646 \u0644\u0644\u0635\u0639\u0648\u062f \u0648\u0627\u0644\u0646\u0632\u0648\u0644 (30 \u062f\u0642\u064a\u0642\u0629 \u0641\u064a \u0627\u0644\u0639\u0628\u0648\u0631\u0627\u062a \u0627\u0644\u0642\u0635\u064a\u0631\u0629). \u062a\u062a\u0623\u062b\u0631 \u0627\u0644\u0639\u0628\u0651\u0627\u0631\u0627\u062a \u0628\u0627\u0644\u0645\u0648\u0633\u0645 \u0648\u0627\u0644\u0637\u0642\u0633\u060c \u0641\u0627\u062d\u062c\u0632 \u0645\u0633\u0628\u0642\u064b\u0627 \u0641\u064a \u0645\u0648\u0633\u0645 \u0627\u0644\u0630\u0631\u0648\u0629.',nl:'De duur is die van de overtocht, plus 2 uur voor in- en ontschepen (30 minuten bij korte overtochten). Veerboten hangen af van seizoen en weer, boek in het hoogseizoen vooraf.',de:'Angegeben ist die reine \u00dcberfahrt, zuz\u00fcglich 2 Stunden f\u00fcr Ein- und Ausschiffung (30 Minuten bei kurzen \u00dcberfahrten). F\u00e4hren h\u00e4ngen von Saison und Wetter ab, buchen Sie in der Hochsaison im Voraus.'},boat:{fr:'La dur\u00e9e est celle de la navigation, plus 2 h d\u0027embarquement et de d\u00e9barquement (30 min sur les courts trajets). Ces liaisons sont souvent saisonni\u00e8res ou priv\u00e9es, renseignez-vous sur place.',en:'The time shown is the sailing itself, plus 2 hours for boarding and disembarking (30 minutes on short trips). These services are often seasonal or private, ask locally.',es:'La duraci\u00f3n es la de la navegaci\u00f3n, m\u00e1s 2 h de embarque y desembarque (30 min en trayectos cortos). Estas conexiones suelen ser estacionales o privadas, inf\u00f3rmese sobre el terreno.',pt:'A dura\u00e7\u00e3o \u00e9 a da navega\u00e7\u00e3o, mais 2 h de embarque e desembarque (30 min em trajetos curtos). Estas liga\u00e7\u00f5es s\u00e3o muitas vezes sazonais ou privadas, informe-se no local.',it:'La durata \u00e8 quella della navigazione, pi\u00f9 2 h di imbarco e sbarco (30 min sui tragitti brevi). Questi collegamenti sono spesso stagionali o privati, informatevi sul posto.',ar:'\u0627\u0644\u0645\u062f\u0629 \u0647\u064a \u0645\u062f\u0629 \u0627\u0644\u0625\u0628\u062d\u0627\u0631\u060c \u0625\u0636\u0627\u0641\u0629 \u0625\u0644\u0649 \u0633\u0627\u0639\u062a\u064a\u0646 \u0644\u0644\u0635\u0639\u0648\u062f \u0648\u0627\u0644\u0646\u0632\u0648\u0644 (30 \u062f\u0642\u064a\u0642\u0629 \u0641\u064a \u0627\u0644\u0631\u062d\u0644\u0627\u062a \u0627\u0644\u0642\u0635\u064a\u0631\u0629). \u063a\u0627\u0644\u0628\u064b\u0627 \u0645\u0627 \u062a\u0643\u0648\u0646 \u0647\u0630\u0647 \u0627\u0644\u062e\u0637\u0648\u0637 \u0645\u0648\u0633\u0645\u064a\u0629 \u0623\u0648 \u062e\u0627\u0635\u0629\u060c \u0641\u0627\u0633\u062a\u0641\u0633\u0631 \u0641\u064a \u0627\u0644\u0645\u0643\u0627\u0646.',nl:'De duur is die van de vaart, plus 2 uur in- en ontschepen (30 minuten op korte trajecten). Deze verbindingen zijn vaak seizoensgebonden of priv\u00e9, informeer ter plaatse.',de:'Angegeben ist die reine Fahrzeit auf dem Wasser, zuz\u00fcglich 2 Stunden f\u00fcr Ein- und Ausschiffung (30 Minuten bei kurzen Strecken). Diese Verbindungen sind oft saisonal oder privat, fragen Sie vor Ort nach.'},mixed:{fr:'Ce trajet encha\u00eene plusieurs moyens de transport, par exemple route puis ferry. La dur\u00e9e totale inclut les temps d\u0027attente entre chaque segment. Le d\u00e9tail du parcours est d\u00e9crit dans la ligne du trajet.',en:'This leg combines several means of transport, for example road then ferry. The total time includes the waiting between each segment. The details are given in the leg description.',es:'Este trayecto encadena varios medios de transporte, por ejemplo carretera y luego ferri. La duraci\u00f3n total incluye las esperas entre cada tramo. El detalle del recorrido figura en la l\u00ednea del trayecto.',pt:'Este trajeto encadeia v\u00e1rios meios de transporte, por exemplo estrada e depois ferry. A dura\u00e7\u00e3o total inclui as esperas entre cada tro\u00e7o. O detalhe do percurso est\u00e1 descrito na linha do trajeto.',it:'Questa tratta combina pi\u00f9 mezzi di trasporto, per esempio strada e poi traghetto. La durata totale comprende le attese tra un segmento e l\u0027altro. Il dettaglio \u00e8 indicato nella riga del percorso.',ar:'\u062a\u062c\u0645\u0639 \u0647\u0630\u0647 \u0627\u0644\u0645\u0631\u062d\u0644\u0629 \u0628\u064a\u0646 \u0639\u062f\u0629 \u0648\u0633\u0627\u0626\u0644 \u0646\u0642\u0644\u060c \u0645\u062b\u0644 \u0627\u0644\u0637\u0631\u064a\u0642 \u062b\u0645 \u0627\u0644\u0639\u0628\u0651\u0627\u0631\u0629. \u0648\u062a\u0634\u0645\u0644 \u0627\u0644\u0645\u062f\u0629 \u0627\u0644\u0625\u062c\u0645\u0627\u0644\u064a\u0629 \u0623\u0648\u0642\u0627\u062a \u0627\u0644\u0627\u0646\u062a\u0638\u0627\u0631 \u0628\u064a\u0646 \u0643\u0644 \u0642\u0637\u0627\u0639 \u0648\u0622\u062e\u0631. \u0648\u062a\u0641\u0627\u0635\u064a\u0644 \u0627\u0644\u0645\u0633\u0627\u0631 \u0645\u0630\u0643\u0648\u0631\u0629 \u0641\u064a \u0633\u0637\u0631 \u0627\u0644\u0631\u062d\u0644\u0629.',nl:'Dit traject combineert meerdere vervoermiddelen, bijvoorbeeld weg en dan veerboot. De totale duur omvat de wachttijden tussen de segmenten. De details staan in de trajectregel.',de:'Diese Etappe verbindet mehrere Verkehrsmittel, zum Beispiel Stra\u00dfe und dann F\u00e4hre. Die Gesamtdauer enth\u00e4lt die Wartezeiten zwischen den Abschnitten. Einzelheiten stehen in der Etappenzeile.'},estimate:{fr:'Cette dur\u00e9e est une estimation, pas encore v\u00e9rifi\u00e9e sur un outil de routage. Prenez-la comme un ordre de grandeur.',en:'This time is an estimate, not yet checked against a routing tool. Treat it as an order of magnitude.',es:'Esta duraci\u00f3n es una estimaci\u00f3n, a\u00fan no verificada con una herramienta de rutas. T\u00f3mela como un orden de magnitud.',pt:'Esta dura\u00e7\u00e3o \u00e9 uma estimativa, ainda n\u00e3o verificada numa ferramenta de rotas. Considere-a como uma ordem de grandeza.',it:'Questa durata \u00e8 una stima, non ancora verificata con uno strumento di navigazione. Prendetela come un ordine di grandezza.',ar:'\u0647\u0630\u0647 \u0627\u0644\u0645\u062f\u0629 \u062a\u0642\u062f\u064a\u0631\u064a\u0629 \u0648\u0644\u0645 \u062a\u064f\u062a\u062d\u0642\u0642 \u0628\u0639\u062f \u0628\u0623\u062f\u0627\u0629 \u062a\u0648\u062c\u064a\u0647. \u0627\u0639\u062a\u0628\u0631\u0647\u0627 \u0645\u0624\u0634\u0631\u064b\u0627 \u062a\u0642\u0631\u064a\u0628\u064a\u064b\u0627 \u0641\u0642\u0637.',nl:'Deze duur is een schatting, nog niet gecontroleerd met een routeplanner. Beschouw hem als een orde van grootte.',de:'Diese Dauer ist eine Sch\u00e4tzung, noch nicht mit einem Routing-Werkzeug gepr\u00fcft. Nehmen Sie sie als Gr\u00f6\u00dfenordnung.'}};

<script>function ortPinMapHotel(){
  function boot(){
    var rail=document.getElementById('rcol')||document.querySelector('body.t30 #mapPanel');
    if(!rail)return;
    var frame=0,lastHeight=0;
    function sync(){
      frame=0;
      if(window.innerWidth<=900)return;
      var top=0;
      ['header.ort-hdr','.ip-bar'].forEach(function(sel){
        var el=document.querySelector(sel);
        if(!el||getComputedStyle(el).display==='none')return;
        var r=el.getBoundingClientRect();
        if(r.bottom>0&&r.top<window.innerHeight)top=Math.max(top,r.bottom);
      });
      top=Math.ceil(top)+8;
      var height=Math.max(180,window.innerHeight-top-8);
      document.documentElement.style.setProperty('--ort-rail-top',top+'px');
      document.documentElement.style.setProperty('--ort-rail-height',height+'px');
      if(height!==lastHeight){
        lastHeight=height;
        if(window.map&&window.map.invalidateSize)window.map.invalidateSize({pan:false});
      }
    }
    function queue(){if(!frame)frame=requestAnimationFrame(sync);}
    window.addEventListener('scroll',queue,{passive:true});
    window.addEventListener('resize',queue);
    if(window.ResizeObserver){
      var ro=new ResizeObserver(queue);
      document.querySelectorAll('header.ort-hdr,.ip-bar').forEach(function(el){ro.observe(el);});
    }
    if(window.MutationObserver)new MutationObserver(function(){queue();setTimeout(queue,300);}).observe(document.body,{attributes:true,attributeFilter:['class']});
    sync();setTimeout(queue,400);setTimeout(queue,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
