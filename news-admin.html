<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OneRoadTrip – Admin News & Presse</title>
<style>
:root{
  --ink:#113f7a;
  --acc:#113f7a;
  --bg:#eef3f7;
  --card:#ffffff;
  --bd:#d4e0ea;
  --mut:#64748b;
  --ok:#2E7D32;
  --danger:#e11d48;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}
header{
  background:var(--acc);
  color:#fff;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
header h1{font-size:18px;margin:0;font-weight:800}
header .sub{font-size:13px;opacity:.85}
.wrap{max-width:920px;margin:0 auto;padding:20px}

/* Barre de connexion dossier */
.connect{
  background:var(--card);border:2px solid var(--acc);border-radius:14px;
  padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.connect .status{font-size:13px;color:var(--mut)}
.connect .status b{color:var(--ink)}

.btn{
  border:none;border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;
  background:var(--acc);color:#fff;font-weight:600;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.btn.danger{background:var(--danger)}
.btn.small{padding:6px 10px;font-size:13px}

/* Onglets */
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{
  flex:0 0 auto;padding:10px 22px;border-radius:10px 10px 0 0;cursor:pointer;
  background:#dbe6f0;color:var(--acc);font-weight:700;border:1px solid var(--bd);border-bottom:none;
}
.tab.active{background:var(--card);color:var(--acc);box-shadow:0 -2px 6px rgba(17,63,122,.08)}

.panel{background:var(--card);border:1px solid var(--bd);border-radius:0 14px 14px 14px;padding:18px}

label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=date],select{
  width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;font-size:14px;color:var(--ink);
}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:220px}

/* Aperçu image */
.img-preview{
  margin-top:8px;width:100%;max-height:200px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);
  background:#f1f5f9;display:none;
}
.hint{font-size:12px;color:var(--mut);margin-top:4px}

/* Éditeur riche */
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0;border:1px solid var(--bd);border-bottom:none;border-radius:8px 8px 0 0;padding:6px;background:#f6f9fb}
.toolbar button{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:14px;color:var(--ink)}
.toolbar button:hover{background:#eaf2f8}
.toolbar input[type=color]{width:34px;height:30px;border:1px solid var(--bd);border-radius:6px;padding:0;cursor:pointer;background:#fff}
.editor{
  border:1px solid var(--bd);border-radius:0 0 8px 8px;min-height:160px;padding:12px;font-size:15px;
  line-height:1.5;color:#1f2937;background:#fff;outline:none;
}
.editor:empty:before{content:attr(data-placeholder);color:#9aa6b2}

.actions{margin-top:18px;display:flex;gap:10px;align-items:center}
.msg{font-size:13px;margin-left:auto}
.msg.ok{color:var(--ok)}
.msg.err{color:var(--danger)}

/* Liste des articles */
.list-title{margin:26px 0 10px;font-size:15px;font-weight:800}
.article{
  border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;
}
.article img{width:90px;height:64px;object-fit:cover;border-radius:6px;background:#f1f5f9;flex-shrink:0}
.article .meta{flex:1;min-width:0}
.article .meta .d{font-size:12px;color:var(--mut)}
.article .meta .t{font-weight:700;margin:2px 0 4px}
.article .meta .b{font-size:13px;color:#475569;max-height:42px;overflow:hidden}
.article .ctrl{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.empty{color:var(--mut);font-size:14px;padding:10px 0}
.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
/* Journal de débogage */
.dbg{margin-top:18px;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px}
.dbg-head{display:flex;gap:10px;align-items:center;margin-bottom:8px;color:#fff;flex-wrap:wrap}
.dbg pre{margin:0;max-height:360px;overflow:auto;font:12px/1.45 Consolas,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<header>
  <h1>OneRoadTrip · Admin</h1>
  <span class="sub">Rédaction News &amp; Presse</span>
</header>

<div class="wrap">

  <div class="connect">
    <span class="status" id="connectStatus">Chargement des articles…</span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="news" id="tabNews">📰 News</div>
    <div class="tab" data-tab="press" id="tabPress">🗞️ Presse</div>
    <div class="tab" data-tab="partners" id="tabPartners">🤝 Partenaires</div>
  </div>

  <div class="panel">
    <input type="hidden" id="editingId" value="">

    <div class="row">
      <div>
        <label for="fDate">Date</label>
        <input type="date" id="fDate">
      </div>
      <div>
        <label for="fImage">Photo (dans assets/news)</label>
        <select id="fImage"><option value="">— Aucune —</option></select>
        <div class="hint" id="imgHint">Chargement des photos…</div>
      </div>
    </div>

    <img id="imgPreview" class="img-preview" alt="">

    <label for="fTitle">Titre</label>
    <input type="text" id="fTitle" placeholder="Titre de l'article">

    <label>Corps de l'article</label>
    <div class="toolbar">
      <button type="button" data-cmd="bold" title="Gras"><b>G</b></button>
      <button type="button" data-cmd="italic" title="Italique"><i>I</i></button>
      <button type="button" data-cmd="formatBlock" data-val="h3" title="Sous-titre">H</button>
      <button type="button" data-cmd="insertUnorderedList" title="Liste">• Liste</button>
      <button type="button" id="linkBtn" title="Lien">🔗 Lien</button>
      <input type="color" id="colorPick" value="#113f7a" title="Couleur du texte">
      <button type="button" id="colorBtn" title="Appliquer la couleur">A couleur</button>
      <button type="button" data-cmd="removeFormat" title="Effacer la mise en forme">✕ format</button>
    </div>
    <div class="editor" id="fBody" contenteditable="true" data-placeholder="Écris ton article ici. Sélectionne du texte puis clique sur Gras ou la couleur."></div>

    <div class="actions">
      <button class="btn" id="saveBtn">✓ Valider</button>
      <button class="btn ghost" id="cancelBtn" style="display:none">Annuler la modification</button>
      <span class="msg" id="formMsg"></span>
    </div>

    <div class="list-title" id="listTitle">Articles publiés</div>
    <div id="articleList"><div class="empty">Aucun article pour l'instant.</div></div>
  </div>

  <div class="dbg">
    <div class="dbg-head">
      <b>🐞 Journal de débogage</b>
      <button class="btn small ghost" id="dbgCopy">Copier le journal</button>
      <button class="btn small ghost" id="dbgClear">Effacer</button>
    </div>
    <pre id="dbgLog"></pre>
  </div>

</div>

<script>
// ===============================
// Journal de débogage (visible en bas de page + console F12)
// ===============================
const DBG = [];
function dbgStr(a){
  if (a === undefined) return 'undefined';
  if (a === null) return 'null';
  if (typeof a === 'string') return a;
  if (a && typeof a === 'object' && typeof a.message === 'string' && a.name) return '[' + a.name + '] ' + a.message;
  try { return JSON.stringify(a); } catch(e){ return String(a); }
}
function dbg(...args){
  const d = new Date();
  const ts = d.toTimeString().slice(0,8) + '.' + String(d.getMilliseconds()).padStart(3,'0');
  const line = ts + '  ' + args.map(dbgStr).join(' ');
  DBG.push(line);
  try { console.log('[ORT-ADMIN] ' + line); } catch(e){}
  const el = document.getElementById('dbgLog');
  if (el){ el.textContent += line + '\n'; el.scrollTop = el.scrollHeight; }
}
function errStr(e){ return e ? ((e.name || 'Erreur') + ' : ' + (e.message || String(e))) : 'inconnue'; }
window.addEventListener('error', e => dbg('❌ ERREUR JS :', e.message, '| ligne', e.lineno));
window.addEventListener('unhandledrejection', e => dbg('❌ ERREUR non gérée :', e.reason));

document.getElementById('dbgCopy').addEventListener('click', async ()=>{
  const txt = DBG.join('\n');
  try {
    await navigator.clipboard.writeText(txt);
    dbg('Journal copié dans le presse-papiers (' + DBG.length + ' lignes).');
  } catch(e){
    const r = document.createRange();
    r.selectNodeContents(document.getElementById('dbgLog'));
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    alert('Copie automatique impossible : le journal est sélectionné, fais Ctrl+C.');
  }
});
document.getElementById('dbgClear').addEventListener('click', ()=>{
  DBG.length = 0;
  document.getElementById('dbgLog').textContent = '';
  dbg('Journal effacé.');
});

// ===============================
// État
// ===============================
// Lecture : /data/news/<fichier> servi par le site.
// Écriture : POST /api/save-news, c'est ort_server.py qui écrit sur le disque.
// Plus aucun dossier à choisir dans le navigateur.
const FILES = { news: 'news.json', press: 'press.json', partners: 'partners.json' };
const DATA_URL = '/data/news/';
const SAVE_URL = '/api/save-news';
let store = { news: [], press: [], partners: [] };
let shapes = {};              // forme d'origine de chaque fichier
let loaded = false;           // articles lus via le site ?
let currentTab = 'news';

dbg('=== Démarrage de la page ===');
dbg('Adresse :', location.href);
dbg('Navigateur :', navigator.userAgent);

// Date du jour par défaut
document.getElementById('fDate').value = new Date().toISOString().slice(0,10);

function setConnectStatus(html, ok){
  const el = document.getElementById('connectStatus');
  el.innerHTML = html;
  el.style.color = ok ? 'var(--ok)' : 'var(--danger)';
  dbg('Bandeau ' + (ok ? '(vert)' : '(ROUGE)') + ' :', el.textContent);
}

// ===============================
// Lecture depuis le site
// ===============================
// Garde la forme d'origine du fichier (liste simple OU objet contenant une liste)
function normalizeShape(name, data){
  if (Array.isArray(data)){ shapes[name] = { type:'array' }; return data; }
  if (data && typeof data === 'object'){
    const prefer = ['items','news','press','partners','articles','data','list','entries'];
    let key = prefer.find(k => Array.isArray(data[k]))
           || Object.keys(data).find(k => Array.isArray(data[k]));
    if (key){ shapes[name] = { type:'wrap', obj:data, key }; return data[key]; }
  }
  shapes[name] = { type:'array' };
  return [];
}

async function fetchJson(name){
  const url = DATA_URL + name;
  try{
    const res = await fetch(url + '?t=' + Date.now(), { cache:'no-store' });
    dbg('Lecture site', url, '→ code', res.status, '| type', res.headers.get('content-type'));
    if (!res.ok) return null;
    const data = await res.json();
    const arr = normalizeShape(name, data);
    dbg('Lecture site', name, '→', arr.length, 'élément(s) | forme', shapes[name].type + (shapes[name].key ? ' (clé "' + shapes[name].key + '")' : ''));
    return arr;
  } catch(e){ dbg('Lecture site', url, '→ ÉCHEC', e); return null; }
}

async function autoLoad(){
  const n  = await fetchJson(FILES.news);
  const p  = await fetchJson(FILES.press);
  const pa = await fetchJson(FILES.partners);
  if (n === null && p === null && pa === null) return false;
  store.news = n || []; store.press = p || []; store.partners = pa || [];
  loaded = true;
  const total = store.news.length + store.press.length + store.partners.length;
  setConnectStatus(`Articles chargés depuis le site (${total}). L'enregistrement passe par le serveur, aucun dossier à choisir.`, true);
  return true;
}

(async ()=>{
  const ok = await autoLoad();
  dbg('Démarrage : lecture via le site', ok ? 'OK' : 'ÉCHEC');
  if (!ok){
    setConnectStatus("Impossible de lire les articles. Lance 1_Lancer_Site_Windows.bat puis ouvre cette page par l'adresse http://127.0.0.1:…/news-admin.html.", false);
  }
  await loadImages();
  renderList();
})();

// ===============================
// Enregistrement par le serveur
// ===============================
async function persist(tab){
  const name = FILES[tab];
  const shape = shapes[name] || { type:'array' };
  let out = store[tab];
  if (shape.type === 'wrap'){ shape.obj[shape.key] = store[tab]; out = shape.obj; }
  dbg('Enregistrement', name, ':', store[tab].length, 'élément(s), forme', shape.type, '→ envoi à', SAVE_URL);
  let res, txt = '';
  try {
    res = await fetch(SAVE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: name, data: out })
    });
    txt = await res.text();
  } catch(e){
    dbg('Enregistrement → serveur INJOIGNABLE', e);
    flash('Pas enregistré : le serveur ne répond pas. Relance 1_Lancer_Site_Windows.bat.', false);
    return false;
  }
  dbg('Enregistrement → code', res.status, '| réponse', txt.slice(0, 400));
  if (res.status === 404 || res.status === 501){
    flash("Pas enregistré : le serveur tourne avec l'ancien ort_server.py. Ferme la fenêtre ORT SERVER et relance 1_Lancer_Site_Windows.bat.", false);
    return false;
  }
  let r = null;
  try { r = JSON.parse(txt); } catch(e){}
  if (!res.ok || !r || !r.success){
    flash('Pas enregistré : ' + ((r && r.error) || ('erreur serveur ' + res.status)), false);
    return false;
  }
  dbg('Enregistrement → OK dans', r.absolu || r.path, '|', r.count, 'élément(s) | copie de secours :', r.backup || 'aucune (fichier neuf)');
  return true;
}

// ===============================
// Photos de assets/news (lues sur le site)
// ===============================
const IMG_EXT = ['.jpg','.jpeg','.png','.webp','.gif','.avif'];
const ASSETS_URL = '/assets/news/';
function isImg(name){ return IMG_EXT.some(ext => (name||'').toLowerCase().endsWith(ext)); }

async function listServerImages(){
  try {
    const res = await fetch(ASSETS_URL + '?t=' + Date.now(), { cache:'no-store' });
    const type = (res.headers.get('content-type') || '').toLowerCase();
    dbg('Photos site', ASSETS_URL, '→ code', res.status, '| type', type);
    if (!res.ok) return [];
    const txt = await res.text();
    const out = new Set();
    if (type.includes('json')){
      const re = /[^"'<>\/\\\s]+\.(?:jpe?g|png|webp|gif|avif)/gi;
      (txt.match(re) || []).forEach(n => out.add(n));
    } else {
      const doc = new DOMParser().parseFromString(txt, 'text/html');
      doc.querySelectorAll('a[href]').forEach(a=>{
        let h = (a.getAttribute('href') || '').split('?')[0].split('#')[0];
        let n = h.split('/').filter(Boolean).pop() || '';
        try { n = decodeURIComponent(n); } catch(e){}
        if (isImg(n)) out.add(n);
      });
    }
    dbg('Photos site →', out.size, 'photo(s) dans la liste');
    return [...out];
  } catch(e){ dbg('Photos site → ÉCHEC', e); return []; }
}

async function loadImages(){
  const sel = document.getElementById('fImage');
  const keep = sel.value;
  sel.innerHTML = '<option value="">— Aucune —</option>';
  const names = new Set(await listServerImages());
  let used = 0;
  for (const t of Object.keys(store)){
    for (const a of (store[t] || [])){
      if (a.image && a.image.startsWith('assets/news/')){ names.add(a.image.split('/').pop()); used++; }
    }
  }
  dbg('Photos : +', used, 'photo(s) déjà utilisée(s) dans les articles | total liste :', names.size);
  const list = [...names].sort();
  for (const n of list){
    const o = document.createElement('option');
    o.value = 'assets/news/' + n;
    o.textContent = n;
    sel.appendChild(o);
  }
  if (keep && [...sel.options].some(o=>o.value===keep)) sel.value = keep;
  document.getElementById('imgHint').textContent = list.length
    ? `${list.length} photo(s) dans assets/news. Pour en ajouter, dépose-les dans assets/news puis recharge la page.`
    : "Aucune photo trouvée dans assets/news.";
}

document.getElementById('fImage').addEventListener('change', ()=>{
  dbg('Photo choisie :', document.getElementById('fImage').value || '(aucune)');
  updateImgPreview();
});
function updateImgPreview(){
  const v = document.getElementById('fImage').value;
  const img = document.getElementById('imgPreview');
  if (v) showImage(v, img);
  else img.style.display = 'none';
}
function showImage(relPath, imgEl){
  const src = '/' + relPath.split('/').map(encodeURIComponent).join('/');
  imgEl.onerror = ()=>{ imgEl.style.display = 'none'; dbg('Aperçu : photo INTROUVABLE sur le site :', src); };
  imgEl.onload  = ()=>{ imgEl.style.display = 'block'; };
  imgEl.src = src;
}

// ===============================
// Éditeur riche
// ===============================
const editor = document.getElementById('fBody');
document.querySelectorAll('.toolbar button[data-cmd]').forEach(b=>{
  b.addEventListener('click', ()=>{
    editor.focus();
    const cmd = b.dataset.cmd;
    if (cmd === 'formatBlock') document.execCommand('formatBlock', false, b.dataset.val);
    else document.execCommand(cmd, false, null);
  });
});
document.getElementById('colorBtn').addEventListener('click', ()=>{
  editor.focus();
  document.execCommand('foreColor', false, document.getElementById('colorPick').value);
});
document.getElementById('linkBtn').addEventListener('click', ()=>{
  editor.focus();
  const url = prompt('Adresse du lien (https://…)');
  if (url) document.execCommand('createLink', false, url);
});

// ===============================
// Onglets
// ===============================
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;
    dbg('Onglet :', currentTab);
    resetForm();
    renderList();
  });
});

// ===============================
// Valider (ajout ou modification)
// ===============================
document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const date = document.getElementById('fDate').value;
  const title = document.getElementById('fTitle').value.trim();
  const image = document.getElementById('fImage').value;
  const body = editor.innerHTML.trim();
  const editingId = document.getElementById('editingId').value;

  dbg('--- Clic Valider --- onglet', currentTab, '| date', date, '| titre', JSON.stringify(title),
      '| photo', image || '(aucune)', '| corps', body.length, 'caractères |', editingId ? ('modification de ' + editingId) : 'nouvel article');

  if (!loaded){ flash("Pas enregistré : les articles n'ont pas pu être lus, je n'écrase rien.", false); return; }
  if (!date){ flash('Indique une date.', false); return; }
  if (!body){ flash('Le corps est vide.', false); return; }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  const before = JSON.parse(JSON.stringify(store[currentTab]));
  try {
    if (editingId){
      const art = store[currentTab].find(a => a.id === editingId);
      if (!art){
        dbg('Valider : article', editingId, 'INTROUVABLE');
        flash("Cet article n'existe plus. Rien n'a été modifié.", false);
        return;
      }
      art.date=date; art.title=title; art.image=image; art.body=body; art.updated=Date.now();
    } else {
      store[currentTab].unshift({
        id: 'a' + Date.now(),
        type: currentTab,
        date, title, image, body,
        updated: Date.now()
      });
    }
    // Tri par date décroissante
    store[currentTab].sort((a,b)=> (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    dbg('Valider : articles dans l\'onglet', before.length, '→', store[currentTab].length);

    const ok = await persist(currentTab);
    dbg('Valider : enregistrement', ok ? 'RÉUSSI' : 'ÉCHOUÉ');
    if (ok){ flash(editingId ? 'Article modifié et enregistré.' : 'Article ajouté et enregistré.', true); resetForm(); renderList(); }
    else { store[currentTab] = before; } // échec : on annule pour éviter les doublons
  } finally {
    saveBtn.disabled = false;
  }
});

document.getElementById('cancelBtn').addEventListener('click', ()=>{ dbg('Annuler la modification'); resetForm(); });

function resetForm(){
  document.getElementById('editingId').value = '';
  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('fTitle').value = '';
  document.getElementById('fImage').value = '';
  document.getElementById('imgPreview').style.display = 'none';
  editor.innerHTML = '';
  document.getElementById('cancelBtn').style.display = 'none';
  document.getElementById('saveBtn').textContent = '✓ Valider';
}

function flash(text, ok){
  dbg('Message ' + (ok ? '(vert)' : '(ROUGE)') + ' :', text);
  const m = document.getElementById('formMsg');
  m.textContent = text;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  if (ok) setTimeout(()=>{ if(m.textContent===text){ m.textContent=''; } }, 4000);
}

// ===============================
// Affichage de la liste
// ===============================
function renderList(){
  const titles = { news:'Articles News publiés', press:'Articles Presse publiés', partners:'Partenaires publiés' };
  document.getElementById('listTitle').textContent = titles[currentTab] || 'Articles publiés';
  const wrap = document.getElementById('articleList');
  const arr = store[currentTab];
  dbg('Liste :', currentTab, '→', arr ? arr.length : 0, 'article(s) affiché(s)');
  if (!arr || arr.length === 0){
    wrap.innerHTML = '<div class="empty">Aucun article pour l\'instant.</div>';
    return;
  }
  wrap.innerHTML = '';
  arr.forEach(a=>{
    const div = document.createElement('div');
    div.className = 'article';
    const plain = (a.body || '').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    div.innerHTML = `
      <img ${a.image ? '' : 'style="display:none"'} alt="" data-img="${escapeHtml(a.image||'')}">
      <div class="meta">
        <div class="d">${formatDate(a.date)}</div>
        <div class="t">${escapeHtml(a.title || '(sans titre)')}</div>
        <div class="b">${escapeHtml(plain).slice(0,140)}</div>
      </div>
      <div class="ctrl">
        <button class="btn ghost small" data-edit="${escapeHtml(a.id||'')}">Modifier</button>
        <button class="btn danger small" data-del="${escapeHtml(a.id||'')}">Supprimer</button>
      </div>`;
    wrap.appendChild(div);
    const imgEl = div.querySelector('img[data-img]');
    if (a.image) showImage(a.image, imgEl);
  });

  wrap.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=> editArticle(b.dataset.edit)));
  wrap.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=> deleteArticle(b.dataset.del)));
}

function editArticle(id){
  dbg('--- Clic Modifier ---', id);
  const a = store[currentTab].find(x=>x.id===id);
  if (!a){ dbg('Modifier : article', id, 'INTROUVABLE'); return; }
  document.getElementById('editingId').value = a.id;
  document.getElementById('fDate').value = a.date || '';
  document.getElementById('fTitle').value = a.title || '';
  const sel = document.getElementById('fImage');
  // ajoute l'option si la photo n'est plus listée
  if (a.image && ![...sel.options].some(o=>o.value===a.image)){
    const o=document.createElement('option'); o.value=a.image; o.textContent=a.image.split('/').pop(); sel.appendChild(o);
  }
  sel.value = a.image || '';
  updateImgPreview();
  editor.innerHTML = a.body || '';
  document.getElementById('cancelBtn').style.display = 'inline-block';
  document.getElementById('saveBtn').textContent = '✓ Enregistrer les modifications';
  window.scrollTo({top:0, behavior:'smooth'});
}

async function deleteArticle(id){
  dbg('--- Clic Supprimer ---', id);
  if (!loaded){ flash("Pas supprimé : les articles n'ont pas pu être lus, je n'écrase rien.", false); return; }
  if (!confirm('Supprimer cet article ?')){ dbg('Supprimer : annulé'); return; }
  const before = store[currentTab];
  store[currentTab] = store[currentTab].filter(x=>x.id!==id);
  dbg('Supprimer : articles', before.length, '→', store[currentTab].length);
  const ok = await persist(currentTab);
  dbg('Supprimer : enregistrement', ok ? 'RÉUSSI' : 'ÉCHOUÉ');
  if (ok){ flash('Article supprimé.', true); renderList(); }
  else { store[currentTab] = before; }
}

// ===============================
// Utilitaires
// ===============================
function formatDate(d){
  if (!d) return '';
  try { return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); }
  catch(e){ return d; }
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
